note: >-
  Two distinct generations of Immutable client libraries exist and the currency
  fields below make the split obvious. The @imtbl/* npm scope (TypeScript SDK,
  monorepo github.com/immutable/ts-immutable-sdk) plus the Unity and Unreal SDKs
  are actively released — every one shipped inside the last three weeks. The
  Immutable X generation (imx-core-sdk-* for Go, Kotlin/JVM, C#, Swift) has not
  released since 2024 and is superseded: Immutable's own deprecation page states
  @imtbl/core-sdk and @imtbl/imx-sdk-js are deprecated in favour of @imtbl/sdk
  after Immutable X merged into Immutable Chain in early 2026. Those entries are
  kept with official: true and deprecated: true rather than dropped, because a
  first-party SDK whose last release predates the API it wraps is a finding.
