name: Immutable rate limits
generated: '2026-10-21'
method: searched
source: https://docs.immutable.com/docs/products/asset-contracts/minting-api
docs:
- https://docs.immutable.com/docs/products/asset-contracts/minting-api
limit_count: 8
note: >-
  Two rate-limit systems with two header families. The general REST surface on
  api.immutable.com emits `x-ratelimit-*` headers (observed live and
  unauthenticated on an anonymous GET of https://api.immutable.com/v1/chains,
  2026-08-23 and again 2026-10-21: `x-ratelimit-limit: 5, 5;w=1`); that anonymous
  ceiling is observed, not documented, so it is recorded under x-observed rather
  than as a docs quote. The Minting API and metadata refresh use a bespoke
  `imx_*` family documented on the minting guide. Minting limits count distinct
  token_ids, not total tokens.
limits:
- name: Minting API - Standard tier
  plan: Standard
  endpoint: POST /v1/chains/{chain_name}/collections/{contract_address}/nfts/mint-requests
  scope: per-project
  window: 1 minute
  max: 200
  burst: 2000
  limit_text: '200'
  unit: distinct token_ids per minute ("NFTs/SFTs per minute")
- name: Minting API - Partner tier
  plan: Partner
  endpoint: POST /v1/chains/{chain_name}/collections/{contract_address}/nfts/mint-requests
  scope: per-project
  window: 1 minute
  max: 2000
  burst: 20000
  limit_text: 2,000
  unit: distinct token_ids per minute
- name: Minting API - Enterprise tier
  plan: Enterprise
  scope: per-project
  limit_text: Custom
  note: Custom; no published number.
- name: Metadata refresh - total NFTs updated
  scope: per-project
  window: 1 minute
  max: 677
  limit_text: 677 per minute
- name: Metadata refresh - token IDs per request
  scope: per-request
  max: 250
  limit_text: Up to 250
- name: Metadata refresh - total metadata size
  scope: per-request
  limit_text: 228 KiB per request
- name: Metadata stacks refresh (by metadata_id)
  scope: per-project
  window: 1 minute
  max: 677
  limit_text: 677 per minute, up to 10 IDs per request
- name: Mint counting rule
  scope: per-project
  limit_text: Rate limits count distinct
  note: Minting 1000 copies of the same ERC-1155 token_id counts as 1 request.
response_headers:
  general_api:
    observed: true
    headers: [x-ratelimit-limit, x-ratelimit-remaining, x-ratelimit-reset]
  minting_api:
    documented: true
    headers: [imx_mint_requests_limit, imx_remaining_mint_requests, imx_mint_requests_limit_reset, imx_mint_requests_retry_after]
  metadata_refresh:
    documented: true
    headers: [imx_refreshes_limit, imx_refresh_limit_reset, imx_remaining_refreshes, retry_after]
  note: >-
    Minting/refresh values are documented as lower_snake_case names such as
    `imx_mint_requests_retry_after: "59.98-seconds"`, not a standard
    `Retry-After`; an agent cannot rely on standard retry-after parsing.
exhaustion:
  status: 429
  error_code: TOO_MANY_REQUESTS_ERROR
  standard_retry_after: false
x-observed:
- url: https://api.immutable.com/v1/chains
  http_status: 200
  fetched: '2026-10-21'
  scope: anonymous caller
  window: 1 second
  max: 5
  headers_seen:
  - 'x-ratelimit-limit: 5, 5;w=1'
  - 'x-ratelimit-remaining: 4'
  - 'x-ratelimit-reset: 1'
