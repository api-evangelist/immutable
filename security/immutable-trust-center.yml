regimes_claimed:
- name: GDPR
  claim: >-
    "We benchmark against the GDPR and the highest security standards." Products
    (Passport, Audience) are described as built on a privacy-by-design framework,
    with mapped data flows, vetted sub-processors, a collection statement shown
    at sign-in, and controller/processor roles defined in commercial agreements.
  evidence: https://www.immutable.com/trust
  supporting_api_surface:
  - operation: deleteAudienceData
    detail: >-
      DELETE /v1/audience/data in the Audience API accepts an erasure request for
      an identity, resolves linked identities via alias mappings, and queues an
      async erasure event — a machine-callable GDPR right-to-erasure path.
  - operation: getTrackingConsent / updateTrackingConsent
    detail: >-
      GET and PUT /v1/audience/tracking-consent expose per-identity consent state
      as an API, so consent is enforceable at ingestion rather than only in a UI.
