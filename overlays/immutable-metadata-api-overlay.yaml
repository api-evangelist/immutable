overlay: 1.0.0
info:
  title: API Evangelist enhancements for the Immutable zkEVM Metadata API
  version: 1.0.0
extends: openapi/immutable-metadata-api-openapi.yml
x-provenance:
  generated: '2026-10-21'
  method: generated
  source:
  - openapi/immutable-metadata-api-openapi.yml
  - overlays (prior combined zkEVM/Audience overlays, 2026-08-23)
  note: Non-destructive Overlay 1.0.0 for one of the 16 per-API contracts split from the two published
    Immutable specs. Actions carried over from the earlier combined overlay only where the target path
    or security scheme exists in this file. The original spec is never mutated.
actions:
- target: $.info
  update:
    x-provider: Immutable
    x-provider-url: https://www.immutable.com
    x-docs: https://docs.immutable.com/api-reference
    x-status-page: https://status.immutable.com
    x-source-spec: https://imx-openapiv3-mr-sandbox.s3.us-east-2.amazonaws.com/openapi.json
    x-source-index: https://docs.immutable.com/llms.txt
- target: $
  update:
    x-environments:
      production:
        base_url: https://api.immutable.com
        chain_name: imtbl-zkevm-mainnet
        chain_id: 13371
        verified: 2026-08-23 GET /v1/chains -> 200
      sandbox:
        base_url: https://api.sandbox.immutable.com
        chain_name: imtbl-zkevm-testnet
        chain_id: 13473
    x-servers-note: The published document declares one server, the sandbox host. Production callers must
      substitute https://api.immutable.com AND the mainnet chain_name path segment. This overlay does
      not rewrite servers[]; it records the divergence.
- target: $
  update:
    x-conventions: conventions/immutable-conventions.yml
    x-errors: errors/immutable-problem-types.yml
    x-rate-limits: rate-limits/immutable-rate-limits.yml
    x-authentication: authentication/immutable-authentication.yml
    x-data-model: data-model/immutable-data-model.yml
    x-webhooks: asyncapi/immutable-webhooks.yml
    x-lifecycle: lifecycle/immutable-lifecycle.yml
- target: $.components.securitySchemes.ImmutableApiKey
  update:
    description: Project API key issued in Immutable Hub. Write operations require the SECRET key; the
      publishable key (prefix pk_imapik-, sandbox pk_imapik-sandbox-) is client-side only and is rejected
      with 401 here.
    x-issued-at: https://hub.immutable.com
    x-docs: https://docs.immutable.com/docs/guides/advanced-setup/api-keys
- target: $.components.securitySchemes.OktaBearerAuth
  update:
    description: Internal/administrative bearer token. Public integrators cannot obtain one; the operations
      it guards (e.g. RefreshCollectionMetadataInternal) are not part of the public contract.
    x-internal: true
