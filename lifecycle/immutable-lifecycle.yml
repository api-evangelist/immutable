deprecation_policy:
  published: true
  url: https://docs.immutable.com/docs/products/immutable-chain/immutable-x-deprecation
  sunset_header: false
  deprecation_header: false
  rfc8594: false
  note: >-
    Immutable publishes a real, itemised deprecation page rather than a generic
    policy statement — it names each interface and gives its current status. What
    it does NOT do is signal deprecation in the protocol: no RFC 8594 `Sunset` or
    `Deprecation` response headers were observed, and no operation in either
    OpenAPI carries `deprecated: true`. An agent therefore cannot learn that an
    endpoint is going away from the wire or from the contract — only from this
    page.
  end_of_life_dates_published: false
  eol_note: >-
    The page repeatedly says "will be removed in future" without naming a date,
    so an integrator cannot plan a migration against a calendar.
