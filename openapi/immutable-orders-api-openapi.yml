      required:
      - id
      - name
    TraitFilter:
      type: object
      description: A trait filter used to match NFTs by metadata attribute
      properties:
        trait_type:
          type: string
          description: The trait type (attribute name)
          example: Background
        values:
          type: array
          description: The trait values to match against
          items:
            type: string
          minItems: 1
          example:
          - Blue
          - Red
      required:
      - trait_type
      - values
    FillStatus:
      description: The ratio of the order that has been filled, an order that has been fully filled will have the same numerator and denominator values.
      type: object
      properties:
        numerator:
          type: string
          description: The numerator of the fill status
          example: '1'
        denominator:
          type: string
          description: The denominator of the fill status
          example: '2'
      required:
      - numerator
      - denominator
    InactiveOrderStatus:
      type: object
      properties:
        name:
          type: string
          description: The order status that indicates an order cannot be fulfilled.
          enum:
          - INACTIVE
        sufficient_approvals:
          type: boolean
          description: Whether the order offerer has sufficient approvals
          example: false
        sufficient_balances:
          type: boolean
          description: Whether the order offerer still has sufficient balance to complete the order
          example: false
      required:
      - name
      - sufficient_approvals
      - sufficient_balances
    MetadataFieldFilter:
      type: object
      description: 'A field-level filter used to match NFTs for a metadata bid. The

        `field_name` is either a top-level metadata field (`name`, `image`,

        `description`, `animation_url`, `external_url`, `youtube_url`) or an

        attribute identified by the `attribute:<trait_type>` prefix (e.g.

        `attribute:Background`). Values match case-insensitively; multiple

        values are OR''d, multiple filters on a bid are AND''d.

        '
      properties:
        field_name:
          type: string
          description: The metadata field name (top-level field or `attribute:<trait_type>`)
          example: attribute:Background
        values:
          type: array
          description: The metadata field values to match against (OR semantics)
          items:
            type: string
          minItems: 1
          example:
          - Blue
          - Red
      required:
      - field_name
      - values
    PendingOrderStatus:
      type: object
      properties:
        name:
          type: string
          description: The order status that indicates the order is yet to be active due to various reasons.
          enum:
          - PENDING
        evaluated:
          type: boolean
          description: Whether the order has been evaluated after its creation
          example: false
        started:
          type: boolean
          description: Whether the order has reached its specified start time
          example: false
      required:
      - name
      - evaluated
      - started
    UnfulfillableOrder:
      type: object
      properties:
        order_id:
          type: string
          description: OrderID for the requested but unfulfillable order
          example: 7df3e99e-f7b3-459c-bef6-ffb66a18bb59
        token_id:
          type: string
          description: Token ID for the ERC721 or ERC1155 token when fulfilling a collection order
          example: '123'
          pattern: \d+
        reason:
          type: string
          description: Nullable string containing error reason if the signing is unsuccessful for the order
          example: Invalid order status INACTIVE for order 7df3e99e-f7b3-459c-bef6-ffb66a18bb59
      required:
      - reason
      - order_id
