          ACTIVE: '#/components/schemas/ActiveOrderStatus'
          INACTIVE: '#/components/schemas/InactiveOrderStatus'
          FILLED: '#/components/schemas/FilledOrderStatus'
          EXPIRED: '#/components/schemas/ExpiredOrderStatus'
    APIError401:
      allOf:
      - $ref: '#/components/schemas/BasicAPIError'
      - type: object
        properties:
          code:
            type: string
            description: Error Code
            enum:
            - UNAUTHORISED_REQUEST
            example: UNAUTHORISED_REQUEST
          details:
            type:
            - object
            - 'null'
            description: Additional details to help resolve the error
        required:
        - code
        - details
    ERC1155CollectionItem:
      type: object
      properties:
        type:
          type: string
          description: Token type user is offering, which in this case is ERC1155
          example: ERC1155_COLLECTION
          enum:
          - ERC1155_COLLECTION
        contract_address:
          type: string
          description: Address of ERC1155 collection
          example: '0x692edAd005237c7E737bB2c0F3D8ccCc10D3479E'
          pattern: ^0x[a-fA-F0-9]{40}$
        amount:
          type: string
          description: A string representing the price at which the user is willing to sell the token. This value is provided in the smallest unit of the token (e.g., wei for Ethereum).
          example: '9750000000000000000'
          pattern: \d+
      required:
      - type
      - contract_address
      - amount
    Trade:
      type: object
      properties:
        buy:
          description: Buy items are transferred from the taker to the maker.
          type: array
          items:
            $ref: '#/components/schemas/Item'
          example:
          - type: NATIVE
            amount: '9750000000000000000'
            contract_address: '0x0165878A594ca255338adfa4d48449f69242Eb8F'
          minItems: 1
          maxItems: 1
        buyer_address:
          description: Deprecated. Use maker and taker addresses instead of buyer and seller addresses.
          type: string
          example: '0xFC99a706C0D05B8C71E1fAAC91b3E1343aC34D40'
        buyer_fees:
          description: Deprecated. Use fees instead. The taker always pays the fees.
          type: array
          items:
            $ref: '#/components/schemas/Fee'
          example: []
          minItems: 0
          maxItems: 1
        fees:
          type: array
          items:
            $ref: '#/components/schemas/Fee'
          example: []
          minItems: 0
          maxItems: 1
        chain:
          $ref: '#/components/schemas/Chain'
        order_id:
          type: string
          example: 7df3e99e-f7b3-459c-bef6-ffb66a18bb59
        blockchain_metadata:
          $ref: '#/components/schemas/TradeBlockchainMetadata'
        indexed_at:
          type: string
          description: Time the on-chain trade event is indexed by the order book system
          format: date-time
          example: '2022-03-07T07:20:50.52Z'
        id:
          type: string
          description: Global Trade identifier
          example: 018792C9-4AD7-8EC4-4038-9E05C598534A
        sell:
          description: Sell items are transferred from the maker to the taker.
          type: array
          items:
            $ref: '#/components/schemas/Item'
          example:
          - type: ERC721
            contract_address: '0x692edAd005237c7E737bB2c0F3D8ccCc10D3479E'
            token_id: '1'
          minItems: 1
          maxItems: 1
        seller_address:
          description: Deprecated. Use maker and taker addresses instead of buyer and seller addresses.
          type: string
          example: '0x002b9B1cbf464782Df5d48870358FA6c09f1b19D'
        maker_address:
          type: string
          example: '0x002b9B1cbf464782Df5d48870358FA6c09f1b19D'
        taker_address:
          type: string
          example: '0xFC99a706C0D05B8C71E1fAAC91b3E1343aC34D40'
      example:
        buy:
        - type: NATIVE
          amount: '9750000000000000000'
          contract_address: '0x0165878A594ca255338adfa4d48449f69242Eb8F'
        buyer_address: '0xFC99a706C0D05B8C71E1fAAC91b3E1343aC34D40'
        buyer_fees: []
        fees: []
        chain:
          id: eip155:11155111
          name: sepolia
        indexed_at: '2022-03-07T07:20:50.52Z'
        id: 018792C9-4AD7-8EC4-4038-9E05C598534A
        sell:
        - type: ERC721
          contract_address: '0x692edAd005237c7E737bB2c0F3D8ccCc10D3479E'
          token_id: '1'
        seller_address: '0x002b9B1cbf464782Df5d48870358FA6c09f1b19D'
        maker_address: '0x002b9B1cbf464782Df5d48870358FA6c09f1b19D'
        taker_address: '0xFC99a706C0D05B8C71E1fAAC91b3E1343aC34D40'
      required:
      - id
      - order_id
      - buy
      - buyer_address
      - sell
      - seller_address
      - buyer_fees
      - fees
      - chain
      - maker_address
      - taker_address
      - indexed_at
      - blockchain_metadata
    FilledOrderStatus:
      type: object
      properties:
        name:
          type: string
          description: A terminal order status indicating that an order has been fulfilled.
          enum:
          - FILLED
      required:
      - name
    ProtocolData:
      type: object
      properties:
        order_type:
          type: string
          description: Seaport order type. Orders containing ERC721 tokens will need to pass in the order type as FULL_RESTRICTED while orders with ERC1155 tokens will need to pass in the order_type as PARTIAL_RESTRICTED
          example: FULL_RESTRICTED
          enum:
          - FULL_RESTRICTED
          - PARTIAL_RESTRICTED
        counter:
          type: string
          description: big.Int or uint256 string for order counter
          example: '92315562'
        zone_address:
          type: string
          description: Immutable zone address
          example: '0x12'
        seaport_address:
          type: string
          description: Immutable Seaport contract address
          example: '0x12'
        seaport_version:
          type: string
          description: Immutable Seaport contract version
          example: '1.5'
      example:
        order_type: FULL_RESTRICTED
        counter: '92315562'
        zone_address: '0x12'
        seaport_address: '0x12'
        seaport_version: '1.5'
      required:
      - order_type
      - counter
      - zone_address
      - seaport_address
      - seaport_version
