aid: immutable
name: Immutable
description: 'Immutable is a games growth and blockchain infrastructure company whose
  platform spans two connected halves: Immutable Audience, a games-focused CDP,
  attribution and player-activation stack (ingestion, analytics, engage, conversion
  funnel, ad-network postbacks), and Immutable Chain, a gaming-optimised Ethereum
  zkEVM with Passport embedded wallets, pre-built ERC-721/ERC-1155/ERC-20 asset
  contracts, a gasless Minting API, a Seaport-based decentralised Orderbook, an NFT
  Indexer and Checkout flows. Developers work against a public REST surface on
  api.immutable.com described by two published OpenAPI 3.0.3 documents, configure
  projects and API keys in Immutable Hub, and integrate through first-party
  TypeScript, Unity and Unreal SDKs.'
image: https://www.immutable.com/images/og-image.jpg
