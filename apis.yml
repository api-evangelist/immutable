apis:
- aid: immutable-zkevm-api
  name: Immutable zkEVM API
  description: 'The Immutable Multi Rollup API — the public REST surface for Immutable
    Chain. Covers activities, chains, collections, NFTs and NFT owners, ERC-20
    tokens, metadata and metadata search, the Seaport-backed Orderbook (listings,
    bids, collection/trait/metadata bids, trades, fulfilment data), crafting
    signatures, pricing and Passport profile operations. 59 operations across 53
    paths, described by a published OpenAPI 3.0.3 document.'
  humanURL: https://docs.immutable.com/api-reference
  baseURL: https://api.immutable.com
  tags:
  - Blockchain
  - NFT
  - Marketplace
  - Orderbook
  - Metadata
  properties:
  - type: OpenAPI
    url: openapi/immutable-zkevm-openapi.json
  - type: Documentation
    url: https://docs.immutable.com/api-reference
  - type: Overlay
    url: overlays/immutable-zkevm-overlay.yaml
- aid: immutable-audience-api
  name: Immutable Audience API
  description: 'The Audience event tracking and identity resolution service. Ingests
    batched identify/track/page/screen messages from game servers and backends,
    reads and updates per-identity tracking consent, and accepts GDPR-style erasure
    requests for an identity. Described by a published OpenAPI 3.0.3 document
    served from the Immutable docs host.'
  humanURL: https://docs.immutable.com/docs/products/audience/analytics/rest-api
  baseURL: https://api.immutable.com
  tags:
  - Analytics
  - Customer Data Platform
  - Consent
  properties:
  - type: OpenAPI
    url: openapi/immutable-audience-openapi.json
  - type: Documentation
    url: https://docs.immutable.com/docs/products/audience/analytics/rest-api
  - type: Overlay
    url: overlays/immutable-audience-overlay.yaml
- aid: immutable-passport-auth
  name: Immutable Passport Authentication
  description: 'Passport is Immutable''s authentication and embedded-wallet product.
    Its OpenID Connect provider publishes anonymous discovery documents at
    auth.immutable.com, exposing the authorization, token, device-code, userinfo,
    JWKS, dynamic-registration and revocation endpoints along with supported
    scopes, grant types and PKCE methods.'
  humanURL: https://docs.immutable.com/docs/products/passport/authentication
  baseURL: https://auth.immutable.com
  tags:
  - Authentication
  - OpenID Connect
  - Wallets
  properties:
  - type: OpenIDConnect
    url: well-known/immutable-openid-configuration.json
  - type: Documentation
    url: https://docs.immutable.com/docs/products/passport/authentication
