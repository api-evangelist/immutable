format: vendor-json
rfc9457: false
note: >-
  Immutable does NOT use RFC 9457 application/problem+json. Every 4xx/5xx in the
  zkEVM API returns application/json shaped by a single base schema,
  BasicAPIError, extended per status with a `code` enum. That envelope is
  unusually good on one axis most vendor envelopes miss: `link` and `trace_id`
  are both REQUIRED, so every error is self-documenting and independently
  traceable without a support round-trip. The published `link` example still
  points at the retired docs.x.immutable.com host, which is worth flagging to
  the provider.
envelope:
  media_type: application/json
  schema: BasicAPIError
  fields:
  - name: message
    required: true
    detail: Human-readable message, max 1024 printable-ASCII characters.
  - name: link
    required: true
    detail: URI to Immutable documentation that helps resolve this error.
  - name: trace_id
    required: true
    detail: >-
      Trace ID of the initial request, max 64 chars. Matches the `x-trace-id`
      response header observed on live responses from api.immutable.com.
  - name: code
    required: true
    detail: Per-status enum, added by the APIError<status> subtypes below.
  - name: details
    required: false
    detail: Present on 400 (VALIDATION_ERROR) only; free-form object, nullable.
