audience_api:
  note: >-
    The Audience ingestion endpoint uses a different, batch-oriented model: a
    200 can carry per-message rejections, so success is not status-only.
  statuses:
  - status: 200
    meaning: >-
      Request accepted. Check `accepted`, `rejected` and `rejections` for
      per-message detail.
  - status: 400
    meaning: >-
      Malformed request (missing header, empty or oversized batch), or the entire
      batch failed validation — in which case the body has the same shape as 200
      with `rejections` populated.
  - status: 401
    meaning: >-
      API key not recognised, or the wrong key type for the endpoint (a
      publishable key sent to DELETE /v1/audience/data, which requires a secret key).
  - status: 500
    meaning: Server error. Retry with exponential back-off.
  rejection_codes:
  - code: MISSING_REQUIRED_FIELD
    cause: A required field for that message type is missing, e.g. `eventName` on a `track` message.
  - code: INVALID_FORMAT
    cause: '`messageId` is not a valid UUID, or `eventTimestamp` is not valid RFC 3339.'
  - code: INVALID_VALUE
    cause: A field value breaks a rule, e.g. `eventTimestamp` too far in the past or future.
  - code: INVALID_ENUM
    cause: A field is not one of its allowed values, e.g. `surface` or `consentLevel`.
  - code: UNSUPPORTED_TYPE
    cause: '`type` is not a supported message type.'
  - code: DUPLICATE_MESSAGE_ID
    cause: The same `messageId` appears more than once in the batch.
  open_set: true
  open_set_note: >-
    Immutable explicitly documents rejection codes as an open set — match the
    ones you handle and fall back to `message` for anything else.
