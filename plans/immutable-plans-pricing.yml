audience: developer-api
pricing_basis: ad-valorem
published: true
plan_count: 1
delivery:
  delivery: managed
note: >-
  Immutable publishes no subscription price list: https://www.immutable.com/pricing
  and /plans returned 404 (2026-08-23) and the commercial call-to-action is
  "Book a demo" (https://www.immutable.com/free-demo). The one published price is
  the Orderbook protocol fee, a percentage of each trade, recorded below. The
  Minting API's Standard / Partner / Enterprise tiers
  (https://docs.immutable.com/docs/products/asset-contracts/minting-api) are
  throughput entitlements with NO price attached; they are recorded in
  rate-limits/immutable-rate-limits.yml, not here. Royalties and marketplace fees
  are set by creators and marketplaces, not by Immutable. On-chain gas is paid in
  IMX and can be sponsored for Passport wallets.
plans:
- name: Orderbook protocol fee
  description: >-
    Fee on every trade executed through the Immutable Orderbook, paid by the
    buyer and deducted from the payment. "The protocol fee is non-negotiable and
    applies to all trades on the Orderbook."
  price: 2
  price_text: 2%
  unit: percent of trade
  features:
  - Applies on Mainnet and Testnet alike (both listed at 2%)
  - Fees are pro-rated on partial fills
  limits: []
