note: >-
  Immutable publishes NO pricing page. https://www.immutable.com/pricing and
  /plans both return 404; the site's only commercial call-to-action is
  "Book a demo" / https://www.immutable.com/free-demo, a 30-minute scoping
  session. What the docs DO publish is a three-tier entitlement ladder attached
  to the Minting API — named tiers with concrete throughput quotas but no money
  attached to any of them. Those tiers are recorded below with `price: null`
  because they are real, published, differentiated entitlements a buyer is
  placed into; they are NOT a price list, and no `Pricing` pointer is emitted in
  apis.yml as a result. The blockchain layer has a separate, non-plan cost
  model: gas on Immutable Chain, denominated in IMX, which Passport can sponsor
  on the developer's behalf.
