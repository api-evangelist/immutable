free_tier:
  exists: true
  detail: >-
    A Sandbox environment on Immutable zkEVM Testnet is free to use, with a
    public faucet for tIMX test funds
    (https://docs.immutable.com/docs/products/immutable-chain/faucet). Public
    read endpoints on api.immutable.com also answer anonymously at 5 requests
    per second.
usage_costs:
- item: On-chain gas
  currency: IMX
  detail: >-
    Transactions on Immutable Chain are paid in IMX (tIMX on testnet). Gas
    sponsorship is available for Passport wallets on pre-approved contracts, so
    the developer can absorb the cost instead of the player. External wallets pay
    their own gas.
- item: Orderbook fees
  detail: >-
    Maker fees are fixed at order creation and cannot be changed; taker fees are
    set at fulfilment. Royalties are configured per collection, minimum 0.5% to
    qualify for Trading Rewards. See
    https://docs.immutable.com/docs/products/orderbook/fees.
