- date: '2026-04-16'
  version: null
  tags:
  - Audience
  title: Audience Web SDK is live, track player behaviour across your game
  breaking: false
  additions:
  - Audience REST API for server-side event tracking — a new REST API that lets
    game studios send behavioural and identity events from their own backend
    servers directly to Immutable's analytics pipeline, with no client-side
    libraries required.
  - Web SDK for client-side event tracking — a new TypeScript SDK for tracking
    page views, user identity, custom events and consent state from websites and
    web games, with built-in anonymous ID persistence for cross-surface
    attribution.
  highlights: >-
    Establishes the Audience data-collection layer, enabling attribution of
    player behaviour across web, game and backend contexts.
