domain_standards:
  market: blockchain gaming / NFT infrastructure
  note: >-
    The domain standards for this market are the Ethereum token and marketplace
    standards, and Immutable declares them in the contract surface itself — the
    zkEVM API's `contract_type` enum, the asset-contract product family, and the
    Seaport protocol backing the Orderbook. This is a real domain-standard
    signature, not a prose claim: an integrator who already speaks ERC-721 /
    ERC-1155 / EIP-712 / Seaport needs no bespoke connector.
  standards:
  - id: erc-721
    conforms: true
    evidence: >-
      `contract_type` values across the NFT, Collection and Stack schemas
      distinguish ERC721 from ERC1155; Immutable ships pre-built ERC-721 asset
      contracts (https://docs.immutable.com/docs/products/asset-contracts/erc721).
  - id: erc-1155
    conforms: true
    evidence: >-
      Same `contract_type` discriminator; the Minting API's `amount` field and
      partial-fill semantics on orders are ERC-1155 specific. Pre-built ERC-1155
      contracts published.
  - id: erc-20
    conforms: true
    evidence: >-
      Dedicated tokens surface — GET /v1/chains/{chain_name}/tokens and
      /tokens/{contract_address} — returning symbol, decimals, canonical status
      and bridge provenance. Pre-built ERC-20 in-game-currency contracts published.
  - id: erc-2981
    conforms: true
    evidence: >-
      Royalties are a first-class field on deployed asset contracts (0.5%-10%),
      documented at
      https://docs.immutable.com/docs/products/asset-contracts/royalties.
  - id: seaport
    conforms: true
    evidence: >-
      The Orderbook is a Seaport deployment — the Order schema carries
      `protocol_data`, `order_hash`, `salt` and `signature`, and Immutable
      maintains forks at github.com/immutable/seaport and
      github.com/immutable/seaport-core. Hard cancel is described as blacklisting
      the order in the settlement contract.
  - id: eip-712
    conforms: true
    evidence: >-
      Link-wallet v2 (POST /passport-profile/v2/linked-wallets) takes an EIP-712
      signature; orderbook listings and bids are EIP-712 signed off-chain.
  - id: eip-155
    conforms: true
    evidence: 'Chain IDs 13371 (mainnet) and 13473 (testnet) are registered EVM chain identifiers.'
  - id: json-rpc-2.0
    conforms: true
    evidence: >-
      Ethereum JSON-RPC at rpc.immutable.com / rpc.testnet.immutable.com, and the
      MCP endpoint at docs.immutable.com/mcp, both speak JSON-RPC 2.0.
compliance_published: true
compliance_summary: >-
  Immutable publishes a compliance posture (GDPR-benchmarked privacy framework,
  named security controls, two public bug bounty programmes) but NOT a single
  third-party certification or audit report. For a company processing player PII
  across the EU that is the most consequential gap on this artifact.
