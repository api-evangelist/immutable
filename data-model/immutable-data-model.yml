note: >-
  Derived from components.schemas ($ref graph plus id-reference fields) across
  both published specs — 201 schemas in the zkEVM API and 16 in the Audience API.
  Immutable's model is chain-rooted: almost every entity carries a `chain`
  descriptor plus a `contract_address`, and identity is the
  (chain, contract_address, token_id) triple rather than an opaque server-issued
  id. That is the single most important thing for an integrator to internalise —
  there are no Stripe-style prefixed object ids to pattern-match on.
identity_scheme:
  style: composite natural keys, not prefixed opaque ids
  primary_key: chain.name + contract_address + token_id
  chain_names:
  - imtbl-zkevm-mainnet
  - imtbl-zkevm-testnet
  address_format: '0x-prefixed 20-byte EVM hex address'
  exceptions:
  - entity: Order
    key: id (UUID) and order_hash
  - entity: Metadata
    key: id (UUID, referenced from NFT.metadata_id)
  - entity: Stack
    key: stack_id (UUID)
  - entity: MintRequest
    key: reference_id (CALLER-supplied; also the idempotency key)
  - entity: Activity
    key: id (UUID)
entities:
