  note: A stack groups NFTs sharing one metadata identity — the unit marketplaces list.
- name: StackBundle
  api: immutable-zkevm-api
  fields: [stack, stack_count, market, listings, bids]
- name: Market
  api: immutable-zkevm-api
  fields: [floor_listing, top_bid, last_trade]
- name: Order
  api: immutable-zkevm-api
  fields: [id, order_hash, account_address, chain, buy, sell, fees, status, type, fill_status,
    protocol_data, salt, signature, start_at, end_at, trait_criteria, metadata_id,
    metadata_criteria, created_at, updated_at]
  note: One schema backs listings, bids, collection bids, trait bids and metadata bids; `type` discriminates.
- name: Listing
  api: immutable-zkevm-api
  fields: [listing_id, price_details, token_id, contract_address, creator, amount]
- name: Bid
  api: immutable-zkevm-api
