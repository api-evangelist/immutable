- name: Trade
  api: immutable-zkevm-api
  fields: [id, order_id, chain, buy, sell, buyer_address, seller_address, maker_address,
    taker_address, fees, buyer_fees, blockchain_metadata, indexed_at]
- name: Token
  api: immutable-zkevm-api
  fields: [chain, contract_address, root_contract_address, root_chain_id, bridge_used,
    symbol, decimals, name, image_url, verification_status, is_canonical, updated_at]
  note: ERC-20 token registry, including bridge provenance back to the L1 contract.
- name: Activity
  api: immutable-zkevm-api
  fields: [id, chain, type, details, updated_at, indexed_at, blockchain_metadata]
  note: Union feed of mints, transfers, sales, deposits and withdrawals; `type` discriminates `details`.
- name: MintRequest
  api: immutable-zkevm-api
