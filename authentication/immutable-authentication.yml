summary:
  types:
  - apiKey
  - http
  - openIdConnect
  api_key_in:
  - header
  models:
  - name: Immutable API key
    detail: >-
      Two key classes issued per project in Immutable Hub. A PUBLISHABLE key
      (prefix `pk_imapik-`, sandbox variant `pk_imapik-sandbox-`) initialises
      client-side SDKs and is safe to expose. A SECRET key is server-side only
      and is what the REST surface accepts in the `x-immutable-api-key` header —
      minting, admin operations and webhook verification. Keys are rotated in
      Hub under Settings -> API Keys, and rotation invalidates the old key
      immediately.
  - name: Passport OIDC bearer token
    detail: >-
      User-scoped JWT access tokens minted by the Passport OpenID Connect
      provider at auth.immutable.com and presented as `Authorization: Bearer`.
      This is what the passport / passport-profile operations in the zkEVM API
      require.
