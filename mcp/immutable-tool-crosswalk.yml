mcp_only:
- tool: search_documentation
  reason: >-
    Documentation search over Immutable's own knowledge base. There is no public
    REST search endpoint for docs; the API's `/search/nfts` and `/search/stacks`
    operations search NFT metadata, an unrelated corpus.
- tool: query_docs_filesystem_documentation
