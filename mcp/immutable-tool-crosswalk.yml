gap_note: >-
  Immutable ships a published Agent Skill and a conformant agent card that both
  describe minting, listing, bidding and player-data flows — but the only
  callable MCP surface is documentation. The skill tells an agent to POST to
  https://api.immutable.com/v1/mint with an `x-immutable-api-key` header, i.e.
  the agent path runs through raw HTTP, not through tools. A minting/orderbook
  MCP server would close the largest agent-readiness gap this profile found.
