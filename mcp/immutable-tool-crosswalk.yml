    Read-only shell over an in-memory virtual filesystem of documentation pages
    and OpenAPI specs. No REST equivalent exists — the closest public artifact is
    fetching https://docs.immutable.com/llms.txt and the .md page variants by hand.
- tool: submit_feedback
  reason: Documentation feedback capture. No REST equivalent.
