mcp_only:
- tool: search_documentation
  reason: Documentation search over Immutable's own knowledge base. There is no public REST search endpoint
    for docs; the API's `/search/nfts` and `/search/stacks` operations search NFT metadata, an unrelated
    corpus.
- tool: query_docs_filesystem_documentation
  reason: Read-only shell over an in-memory virtual filesystem of documentation pages and OpenAPI specs.
    No REST equivalent exists — the closest public artifact is fetching https://docs.immutable.com/llms.txt
    and the .md page variants by hand.
- tool: submit_feedback
  reason: Documentation feedback capture. No REST equivalent.
