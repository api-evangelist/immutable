note: 'The headline finding is a total divergence, and it is worth stating plainly: Immutable''s MCP server
  and Immutable''s REST API do not overlap at all. The server at docs.immutable.com/mcp exposes three
  DOCUMENTATION tools — search the docs, read the docs filesystem, submit feedback — and binds to zero
  of the 63 published REST operations. An agent connected to it can read about the API but cannot call
  it. Every one of the 63 operations is therefore rest_only, and all three tools are mcp_only. No tool
  was mapped speculatively.'
