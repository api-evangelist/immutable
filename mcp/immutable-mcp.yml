source: https://docs.immutable.com/mcp
name: Immutable Documentation MCP Server
description: >-
  Immutable serves a remote, anonymous Model Context Protocol endpoint from its
  own documentation host. A JSON-RPC tools/list POST returns HTTP 200 with a
  text/event-stream body carrying three real tools and their inputSchemas. The
  server is documentation-scoped — it searches and reads Immutable's docs and
  OpenAPI specs and accepts feedback — it does NOT expose the zkEVM or Audience
  REST operations as tools. That distinction is carried in
  mcp/immutable-tool-crosswalk.yml.
deployment:
  mode: remote
  endpoint: https://docs.immutable.com/mcp
  auth: none
  verified: probed
transport:
  protocol: JSON-RPC 2.0 over HTTP
  accept: application/json, text/event-stream
  response_content_type: text/event-stream
tool_count: 3
tools:
- name: search_documentation
  title: Search documentation
  summary: >-
    Search the Immutable documentation knowledge base for relevant content, code
    examples, API references and guides; returns contextual content with titles
    and direct page links.
  input_schema:
    query:
      type: string
      required: true
      description: Search query
  annotations:
    readOnlyHint: true
    destructiveHint: false
    idempotentHint: true
    openWorldHint: false
- name: query_docs_filesystem_documentation
  summary: >-
    Run a read-only shell-like query (rg, grep, find, tree, ls, cat, head, tail,
    stat, wc, sort, uniq, cut, sed, awk, jq) against an in-memory virtual
    filesystem containing only the Immutable documentation pages and OpenAPI
    specs. Stateless per call; no writes, no network, no process control.
  input_schema:
    command:
      type: string
      required: true
  annotations:
    readOnlyHint: true
    destructiveHint: false
    idempotentHint: true
    openWorldHint: false
- name: submit_feedback
  summary: Submit feedback about a documentation page.
  input_schema:
    path:
      type: string
      required: true
    feedback:
      type: string
      required: true
  annotations:
    readOnlyHint: false
    destructiveHint: false
    idempotentHint: false
    openWorldHint: true
raw_tools_list: immutable-mcp-tools.json
