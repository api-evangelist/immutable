name: Immutable Documentation MCP Server
description: Immutable serves a remote, anonymous Model Context Protocol endpoint from its own documentation
  host. A JSON-RPC tools/list POST returns HTTP 200 with a text/event-stream body carrying three real
  tools and their inputSchemas. The server is documentation-scoped — it searches and reads Immutable's
  docs and OpenAPI specs and accepts feedback — it does NOT expose the zkEVM or Audience REST operations
  as tools. That distinction is carried in mcp/immutable-tool-crosswalk.yml.
